name: Build NovahChat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android Wrapper Tools
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure App to use Render Live URL
        run: |
          echo '{
            "appId": "com.novah.chat",
            "appName": "NovahChat",
            "webDir": "public",
            "server": {
              "url": "https://novahclaude.onrender.com",
              "cleartext": true
            }
          }' > capacitor.config.json

      - name: Generate Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Setup Java Builder
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compile APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Final APK File
        uses: actions/upload-artifact@v4
        with:
          name: NovahChat-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
